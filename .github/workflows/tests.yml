name: UI Tests

on:
  workflow_dispatch: {}

jobs:
  run-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: qa-autotest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: qa-autotest/target/surefire-reports/